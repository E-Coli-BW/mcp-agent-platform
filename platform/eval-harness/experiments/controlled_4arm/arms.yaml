# 4-arm config for controlled experiment.
#
# Arm A vs C is the headline number (your engineering vs bare model).
# B/D give cost/ceiling context.

arms:
  - id: arm_a
    label: "你的 agent + 7B"
    purpose: "你的完整方案 (主角)"
    model: qwen2.5:7b
    backend: ollama   # ollama | openai | mlx
    features:
      hallucination_guard: true
      reflexion: true
      verifier: true
      direct_tool_routing: true
    sampling:
      temperature: 0.2   # 同步所有 arm,排除采样偏差
      top_p: 0.95
      max_tokens: 4096

  - id: arm_b
    label: "你的 agent + 0.5B"
    purpose: "小模型 + 你的工程 (cost-correctness tradeoff)"
    model: qwen2.5:0.5b
    backend: ollama
    features:
      hallucination_guard: true
      reflexion: true
      verifier: true
      direct_tool_routing: true
    sampling:
      temperature: 0.2
      top_p: 0.95
      max_tokens: 4096

  - id: arm_c
    label: "裸 7B (control)"
    purpose: "控制组 — 关掉所有你的工程,只剩 7B 模型 + 基础 tool calling"
    model: qwen2.5:7b
    backend: ollama
    features:
      hallucination_guard: false   # ← critical: 关掉
      reflexion: false             # ← critical: 关掉
      verifier: false              # ← critical: 关掉
      direct_tool_routing: false
    sampling:
      temperature: 0.2
      top_p: 0.95
      max_tokens: 4096

  - id: arm_d
    label: "GPT-4o ceiling"
    purpose: "商业天花板 reference (诚实距离)"
    model: gpt-4o
    backend: openai
    features:
      hallucination_guard: false   # GPT-4o 不需要你的 guard
      reflexion: false
      verifier: false
      direct_tool_routing: false
    sampling:
      temperature: 0.2
      top_p: 0.95
      max_tokens: 4096

# Runtime knobs (shared across arms)
runtime:
  agent_url: "http://localhost:8580"   # python agent-server
  trials_per_task: 5                   # n-of-k = 3/5 pass threshold
  parallelism: 2                       # how many tasks in flight at once
  timeout_seconds: 180                 # per single trial
  retry_on_5xx: 2                      # transient infra hiccup retries
