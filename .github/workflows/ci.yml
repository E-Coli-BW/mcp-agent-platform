name: CI — Build & Test

on:
  push:
    branches: [master, main]
    paths:
      - 'platform/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'Makefile'
      - 'scripts/pre-commit'
      - '.github/workflows/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'platform/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'Makefile'
      - 'scripts/pre-commit'
      - '.github/workflows/**'

jobs:
  java-tests:
    name: Java Tests
    runs-on: ubuntu-latest
    env:
      MAVEN_LOCAL_REPO: ${{ github.workspace }}/platform/memory-server/tmp-m2-repo
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: |
            platform/memory-server/tmp-m2-repo
            platform/auth-service/tmp-m2-repo
          key: maven-${{ hashFiles('platform/**/pom.xml') }}
          restore-keys: maven-

      - name: Create Maven settings
        run: |
          cat > platform/memory-server/tmp-mvn-settings.xml << 'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>central-mirror</id>
                <mirrorOf>central</mirrorOf>
                <url>https://repo.maven.apache.org/maven2/</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
          cp platform/memory-server/tmp-mvn-settings.xml platform/auth-service/tmp-mvn-settings.xml

      - name: Build mcp-common
        run: make build-common

      - name: Run Java tests
        run: make test-java

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('platform/agent-server/pyproject.toml') }}

      - name: Install dependencies
        run: |
          cd platform/agent-server
          python -m venv .venv
          .venv/bin/pip install -e '.[dev,rag]' -q

      - name: Context State Contract
        run: make test-python-contract

      - name: Agent Runtime Contract
        run: make test-agent-runtime-contract

      - name: Run Python tests
        run: |
          cd platform/agent-server
          .venv/bin/python -m pytest tests/ -q --tb=short

  typescript-tests:
    name: TypeScript & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            platform/mcp-cli/package-lock.json
            platform/frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix platform/mcp-cli --workspaces=false
          npm ci --prefix platform/frontend --workspaces=false

      - name: Build and test MCP servers
        run: make test-typescript

      - name: Build frontend
        run: make test-frontend

  verify:
    name: All Tests Passed
    needs: [java-tests, python-tests, typescript-tests]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ All tests passed — Java + Python + TypeScript + Frontend"
